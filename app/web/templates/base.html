<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI YouTube Studio{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<main>

</body>
</html>
